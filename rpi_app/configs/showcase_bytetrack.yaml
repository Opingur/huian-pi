# Windows showcase only.  The Raspberry Pi retains ultralytics' default bytetrack.yaml.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
# Retain a briefly blurred or occluded runner long enough to be reacquired.
track_buffer: 45
match_thresh: 0.80
fuse_score: true